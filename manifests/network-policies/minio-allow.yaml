apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-allow
  namespace: mattermost-k3d
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mattermost
        - podSelector:
            matchLabels:
              job-name: minio-create-bucket
      ports:
        - protocol: TCP
          port: 9000
