apiVersion: v1
kind: ConfigMap
metadata:
  name: mattermost-config
  namespace: mattermost-k3d
data:
  MM_SQLSETTINGS_DRIVERNAME: postgres
  # redis cache requires an enterprise license
  # server refuses to boot without one
  # MM_CACHESETTINGS_CACHETYPE: redis
  MM_CACHESETTINGS_REDISADDRESS: redis:6379
  MM_CACHESETTINGS_REDISDB: "0"
  MM_SERVICESETTINGS_SITEURL: http://mattermost.127.0.0.1.nip.io
  MM_FILESETTINGS_DRIVERNAME: amazons3
  MM_FILESETTINGS_AMAZONS3ENDPOINT: minio:9000
  MM_FILESETTINGS_AMAZONS3BUCKET: mattermost-files
  MM_FILESETTINGS_AMAZONS3SSL: "false"
  MM_FILESETTINGS_AMAZONS3REGION: us-east-1
